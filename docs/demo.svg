<circle cx="64" cy="22" r="6" fill="#28C840"/>
<text x="380.0" y="27" fill="#8B90A0" text-anchor="middle" style="font-size:12px">outpost</text>
<g class="l l0"><text x="22" y="73"><tspan fill="#8B90A0">$ </tspan><tspan fill="#ECEEF3" class="b">outpost setup 203.0.113.7</tspan></text></g>
<g class="l l1"><text x="22" y="94"><tspan fill="#4ADE80">1/5</tspan><tspan fill="#ECEEF3" class="b">  SSH key</tspan></text></g>
