<g class="l l15"><text x="22" y="388"><tspan fill="#4ADE80">    ✓ </tspan><tspan fill="#ECEEF3">Claude </tspan><tspan fill="#8B90A0">signed in</tspan></text></g>
<g class="l l16"><text x="22" y="409"><tspan fill="#4ADE80">    ✓ </tspan><tspan fill="#ECEEF3">GitHub </tspan><tspan fill="#8B90A0">signed in</tspan></text></g>
<g class="l l17"><text x="22" y="430"><tspan fill="#4ADE80">    ✓ </tspan><tspan fill="#ECEEF3">T3 Connect </tspan><tspan fill="#8B90A0">signed in</tspan></text></g>
<g class="l l18"><text x="22" y="451"><tspan fill="#4ADE80">5/5</tspan><tspan fill="#ECEEF3" class="b">  Final check</tspan></text></g>
<g class="l l19"><text x="22" y="472"><tspan fill="#4ADE80">    ✓ </tspan><tspan fill="#ECEEF3">Rebooting </tspan><tspan fill="#8B90A0">14s</tspan></text></g>
<g class="l l20"><text x="22" y="493"><tspan fill="#4ADE80">    ✓ </tspan><tspan fill="#ECEEF3">T3 Code, Docker and Tailscale running </tspan><tspan fill="#8B90A0">3s</tspan></text></g>
<g class="l lbox"><rect x="22" y="506.4" width="470" height="65.10000000000001" rx="8" fill="none" stroke="#4ADE80"/><text x="38" y="530.4"><tspan fill="#4ADE80" class="b">✓ All set.</tspan><tspan fill="#ECEEF3"> 203.0.113.7 is ready for your agents.</tspan></text><text x="38" y="551.4" fill="#8B90A0">Open T3 Code, pick the server, and start prompting.</text><rect class="cursor" x="22" y="577.0" width="8" height="15" fill="#ECEEF3"/></g>
