<g class="l l6"><text x="22" y="199"><tspan fill="#4ADE80">    ✓ </tspan><tspan fill="#ECEEF3">System packages </tspan><tspan fill="#8B90A0">41s</tspan></text></g>
<g class="l l7"><text x="22" y="220"><tspan fill="#4ADE80">    ✓ </tspan><tspan fill="#ECEEF3">Node.js </tspan><tspan fill="#8B90A0">12s</tspan></text></g>
<g class="l l8"><text x="22" y="241"><tspan fill="#4ADE80">    ✓ </tspan><tspan fill="#ECEEF3">Docker </tspan><tspan fill="#8B90A0">38s</tspan></text></g>
<g class="l l9"><text x="22" y="262"><tspan fill="#4ADE80">    ✓ </tspan><tspan fill="#ECEEF3">Tailscale </tspan><tspan fill="#8B90A0">9s</tspan></text></g>
<g class="l l10"><text x="22" y="283"><tspan fill="#4ADE80">    ✓ </tspan><tspan fill="#ECEEF3">User, SSH and firewall </tspan><tspan fill="#8B90A0">3s</tspan></text></g>
