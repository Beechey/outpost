<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="outpost logo">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1B2E"/>
      <stop offset="1" stop-color="#24283B"/>
    </linearGradient>
    <linearGradient id="tent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AA2F7"/>
      <stop offset="1" stop-color="#5A7FD6"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="36" fill="url(#sky)"/>
  <!-- signal from the beacon -->
  <g fill="none" stroke="#9ECE6A" stroke-width="5" stroke-linecap="round">
    <path d="M62 38a26 26 0 0 1 36 0" opacity="0.9"/>
    <path d="M52 27a40 40 0 0 1 56 0" opacity="0.5"/>
  </g>
  <circle cx="80" cy="50" r="7" fill="#9ECE6A"/>
  <!-- ground -->
  <path d="M20 122q60-14 120 0v2H20z" fill="#3B4261"/>
  <!-- outpost -->
  <path d="M80 60 L122 120 H38 Z" fill="url(#tent)" stroke-linejoin="round"/>
  <path d="M80 86 L94 120 H66 Z" fill="#1A1B2E"/>
  <line x1="80" y1="57" x2="80" y2="62" stroke="#7AA2F7" stroke-width="4" stroke-linecap="round"/>
</svg>
